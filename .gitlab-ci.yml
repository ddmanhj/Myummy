  - deploy
  - .pre
  - .post

test_changes:
  stage: test
  script:
    - echo "Running tests..."
  only:
    - staging

merge_staging_to_main:
  stage: merge
  script:
    - git config --global user.email "ddmanhj@gmail.com"
    - git config --global user.name "Manhj"
    - git checkout main
    - git merge --no-ff staging
    - git push origin main
  only:
    - staging
